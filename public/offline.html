<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1B5E20" />
    <title>অফলাইন — কৃষি এআই</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Hind Siliguri', system-ui, -apple-system, sans-serif;
        background: linear-gradient(135deg, #1B5E20 0%, #2E7D32 50%, #43A047 100%);
        color: #fff;
        padding: 1.5rem;
        text-align: center;
      }
      .card {
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 1.5rem;
        padding: 2.5rem 2rem;
        max-width: 26rem;
        width: 100%;
        backdrop-filter: blur(8px);
      }
      h1 { font-size: 1.5rem; margin: 0 0 0.5rem; font-weight: 700; }
      p { opacity: 0.9; line-height: 1.6; margin: 0 0 1.5rem; }
      button {
        padding: 0.75rem 1.75rem;
        border: none;
        border-radius: 999px;
        background: #fff;
        color: #1B5E20;
        font-family: inherit;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.15s ease;
      }
      button:hover { transform: translateY(-2px); }
      .icon { font-size: 3rem; display: block; margin-bottom: 0.75rem; }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="icon">📵</span>
      <h1>আপনি অফলাইনে আছেন</h1>
      <p>
        ইন্টারনেট সংযোগ নেই। আগের বার যে তথ্য সংরক্ষিত হয়েছে তা এখনও দেখা যাবে।
        সংযোগ ফিরে আসলে আবার চেষ্টা করুন।
      </p>
      <button onclick="location.reload()">আবার চেষ্টা করুন</button>
    </div>
  </body>
</html>
